id = "herdr-explorer"
name = "Explorer"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "File tree with file-type icons, git branch, and a collapsible per-file git diff viewer"
platforms = ["linux", "macos", "windows"]

# Runs on `herdr plugin install`. For `herdr plugin link` build it yourself:
#   go build -o bin/herdr-explorer.exe .
[[build]]
command = ["go", "build", "-o", "bin/herdr-explorer.exe", "."]

# Open Files (left) and Changes (right) around the chat on start and for every new
# workspace/tab. Turn off: create an empty file named "no-auto" in
# `herdr plugin config-dir herdr-explorer`.
[[startup]]
command = ["bin/herdr-explorer.exe", "auto"]

[[events]]
on = "workspace.created"
command = ["bin/herdr-explorer.exe", "auto"]

[[events]]
on = "tab.created"
command = ["bin/herdr-explorer.exe", "auto"]

# Layout per tab:  Files | chat | Changes  (opened by the hooks above).
[[panes]]
id = "files"
title = "Files"
placement = "split"
command = ["bin/herdr-explorer.exe", "--view", "files"]

[[panes]]
id = "changes"
title = "Changes"
placement = "split"
command = ["bin/herdr-explorer.exe", "--view", "diff"]
